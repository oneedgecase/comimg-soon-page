<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --bg-accent: #1e293b;
      --card: rgba(15, 23, 42, 0.72);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.22), transparent 35%),
        linear-gradient(135deg, var(--bg), var(--bg-accent));
      color: var(--text);
    }

    .card {
      width: min(100%, 680px);
      padding: 56px 32px;
      border: 1px solid var(--border);
      border-radius: 24px;
      text-align: center;
      background: var(--card);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1;
    }

    p {
      margin: 20px auto 0;
      max-width: 520px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Launching soon</div>
    <h1>Coming Soon</h1>
    <p>
      We're putting the finishing touches on something great. Check back soon to see what’s coming.
    </p>
  </main>
</body>
</html>
